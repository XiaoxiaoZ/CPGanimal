[package]
name = "cpg-arena"
version = "0.1.0"
edition = "2021"
description = "Evolve CPG-driven 2D creatures with a genetic algorithm, then race or fight them."
license = "MIT"

[features]
default = ["gui", "sound"]
gui = ["dep:eframe", "dep:rfd", "dep:chrono"]
# Sound effects in the Cup tab (needs ALSA on Linux).
sound = ["dep:cpal"]

[dependencies]
rapier2d = "0.35"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.35", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = { version = "0.17", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
cpal = { version = "0.18", optional = true }

[[bin]]
name = "arena-gui"
required-features = ["gui"]

[profile.release]
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
